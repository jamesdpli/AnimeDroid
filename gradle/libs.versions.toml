[versions]
ktx = "1.9.0"
appcompat = "1.5.1"
retrofit = "2.9.0"
coil = "2.2.2"
lifecycleViewmodelKtx = "2.2.2"
material = "1.8.0"
constraintLayout = "2.1.4"
dagger = "2.45"
shimmer = "0.5.0"
paging = "3.1.1"
navigation = "2.5.3"
androidxTest = "1.1.3"
espresso = "3.4.0"
junit = "4.13.2"
androidGradlePlugin = "8.12.3"
navigationPlugin = "2.5.3"
kotlinPlugin = "1.6.21"

[libraries]
# Androidx
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "ktx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-lifecycleviewmodelktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycleViewmodelKtx" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintLayout" }
androidx-navigation-frgamentKtx = { group = "androidx.navigation", name = "navigation-fragment-ktx", version.ref = "navigation" }
androidx-navigation-uiKtx = { group = "androidx.navigation", name = "navigation-ui-ktx", version.ref = "navigation" }
androidx-paging = { group = "androidx.paging", name = "paging-runtime", version.ref = "paging" }
androidx-test-ext = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTest" }
androidx-test-espresso = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }

# Retrofit
square-retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
square-retrofit-gson-converter = { group = "com.squareup.retrofit2", name = "converter-gson", version.ref = "retrofit" }

# Coil
coil = { group = "io.coil-kt", name = "coil", version.ref = "coil" }

# Material UI
material = { group = "com.google.android.material", name = "material", version.ref = "material" }

# Dagger
dagger-android = { group = "com.google.dagger", name = "dagger-android", version.ref = "dagger" }
dagger-android-support = { group = "com.google.dagger", name = "dagger-android-support", version.ref = "dagger" }
dagger-android-processor = { group = "com.google.dagger", name = "dagger-android-processor", version.ref = "dagger" }
dagger-android-compiler = { group = "com.google.dagger", name = "dagger-compiler", version.ref = "dagger" }

# Shimmer
shimmer = { group = "com.facebook.shimmer", name = "shimmer", version.ref = "shimmer" }

# Junit
junit = { group = "junit", name = "junit", version.ref = "junit"}

[plugins]
android-application = { id = "com.android.application", version.ref = "androidGradlePlugin" }
navigation = { id = "androidx.navigation.safeargs", version.ref = "navigationPlugin" }
kotlin = { id = "org.jetbrains.kotlin.android", version.ref = "kotlinPlugin" }